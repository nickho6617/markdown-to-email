<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to Email — Free GitHub Pages Formatter</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-canvas: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --border-focus: #3b82f6;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --warning: #f59e0b;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-canvas);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar */
        header {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: #eff6ff;
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 8px;
            border-radius: 9999px;
            border: 1px solid #bfdbfe;
        }

        .brand h1 {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            color: #0f172a;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* App Layout */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: row;
            padding: 16px 20px;
            gap: 16px;
            min-height: 0;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            min-width: 0;
        }

        .pane-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #fdfdfd;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .pane-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Buttons & Controls */
        button, select {
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button.btn-primary {
            background: var(--primary);
            color: #ffffff;
            border: 1px solid var(--primary);
            font-weight: 600;
        }

        button.btn-primary:hover {
            background: var(--primary-hover);
        }

        button.btn-secondary {
            background: #ffffff;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        button.btn-secondary:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        button.btn-clean {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
            font-weight: 600;
        }

        button.btn-clean:hover {
            background: #fde68a;
        }

        button.btn-success {
            background: var(--success) !important;
            border-color: var(--success) !important;
            color: #ffffff !important;
        }

        select {
            background: #ffffff;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 5px 8px;
        }

        /* Editor & Preview */
        textarea {
            flex: 1;
            border: none;
            padding: 16px;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 13.5px;
            line-height: 1.6;
            color: #1e293b;
            resize: none;
            outline: none;
            background: #ffffff;
        }

        .preview-wrapper {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: #ffffff;
        }

        /* Toast notification */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: var(--shadow-md);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.2s ease;
            pointer-events: none;
            z-index: 1000;
        }

        #toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 860px) {
            .workspace {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">
            <h1>Markdown &rarr; Email Ready</h1>
            <span class="brand-badge">GitHub Pages Free Tool</span>
        </div>
        <div class="header-actions">
            <button class="btn-clean" id="cleanTextBtn" title="Strips terminal/box bars (│, |) and unwraps broken console lines">
                ✨ Clean Pasted Text
            </button>
            <button class="btn-secondary" id="clearBtn" title="Clear screen">
                🗑️ Clear
            </button>
            <button class="btn-secondary" id="copyMarkdownBtn">
                Copy Clean MD
            </button>
            <button class="btn-secondary" id="copyHtmlBtn">
                Copy HTML
            </button>
            <button class="btn-primary" id="copyRichBtn">
                📋 Copy for Email (Rich Text)
            </button>
        </div>
    </header>

    <div class="workspace">
        <!-- Input Pane -->
        <div class="pane">
            <div class="pane-toolbar">
                <span class="pane-title">Input (Markdown or Pasted Text)</span>
                <div class="toolbar-group">
                    <span id="charCount" style="font-size: 12px; color: var(--text-muted);">0 chars</span>
                </div>
            </div>
            <textarea id="markdownInput" autofocus spellcheck="false" placeholder="Paste your markdown or raw text here...&#10;&#10;Use '✨ Clean Pasted Text' to strip terminal pipes (│, |) and repair broken line wraps, then click 'Copy for Email'!"></textarea>
        </div>

        <!-- Preview Pane -->
        <div class="pane">
            <div class="pane-toolbar">
                <span class="pane-title">Email-Safe Rich Preview</span>
                <div class="toolbar-group">
                    <label style="font-size: 12px; color: var(--text-muted); margin-right: 4px;">Font:</label>
                    <select id="fontSelect">
                        <option value="Arial, sans-serif">Arial (Universal)</option>
                        <option value="Calibri, Helvetica, sans-serif">Calibri</option>
                        <option value="'Segoe UI', Helvetica, Arial, sans-serif">Segoe UI</option>
                        <option value="Georgia, serif">Georgia</option>
                        <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">System Default</option>
                    </select>
                </div>
            </div>
            <div class="preview-wrapper" id="previewArea"></div>
        </div>
    </div>

    <div id="toast">Copied to clipboard!</div>

    <script>
        const input = document.getElementById('markdownInput');
        const preview = document.getElementById('previewArea');
        const fontSelect = document.getElementById('fontSelect');
        const cleanTextBtn = document.getElementById('cleanTextBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyRichBtn = document.getElementById('copyRichBtn');
        const copyHtmlBtn = document.getElementById('copyHtmlBtn');
        const copyMarkdownBtn = document.getElementById('copyMarkdownBtn');
        const charCount = document.getElementById('charCount');
        const toast = document.getElementById('toast');

        // Configure marked options
        marked.setOptions({
            gfm: true,
            breaks: false
        });

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2400);
        }

        // Email-safe styling definitions
        function getEmailStyles(fontFamily) {
            return {
                'p': `margin: 0 0 12px 0; line-height: 1.55; font-family: ${fontFamily}; color: #222222; font-size: 14px;`,
                'h1': `margin: 18px 0 8px 0; font-family: ${fontFamily}; font-size: 20px; font-weight: 700; color: #111111; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px;`,
                'h2': `margin: 16px 0 8px 0; font-family: ${fontFamily}; font-size: 16px; font-weight: 700; color: #111111; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px;`,
                'h3': `margin: 14px 0 6px 0; font-family: ${fontFamily}; font-size: 14px; font-weight: 700; color: #111111;`,
                'a': 'color: #2563eb; text-decoration: underline;',
                'code': 'font-family: ui-monospace, Consolas, "Courier New", monospace; background-color: #f1f5f9; color: #0f172a; padding: 2px 5px; border-radius: 4px; font-size: 88%; border: 1px solid #e2e8f0;',
                'pre': 'font-family: ui-monospace, Consolas, "Courier New", monospace; background-color: #f8fafc; color: #0f172a; padding: 12px; overflow-x: auto; border-radius: 6px; line-height: 1.45; border: 1px solid #e2e8f0; margin: 0 0 12px 0;',
                'blockquote': 'padding: 4px 12px; color: #475569; border-left: 3px solid #cbd5e1; margin: 0 0 12px 0; background: #f8fafc; font-style: italic;',
                'table': `border-collapse: collapse; width: 100%; margin: 0 0 14px 0; font-family: ${fontFamily}; font-size: 13px; border: 1px solid #cbd5e1;`,
                'th': 'padding: 8px 12px; border: 1px solid #cbd5e1; background-color: #f1f5f9; font-weight: bold; text-align: left; color: #1e293b;',
                'td': 'padding: 8px 12px; border: 1px solid #cbd5e1; color: #334155; vertical-align: top; word-break: break-word; overflow-wrap: break-word;',
                'ul': `padding-left: 22px; margin: 0 0 12px 0; font-family: ${fontFamily}; color: #222222; font-size: 14px; line-height: 1.55;`,
                'ol': `padding-left: 22px; margin: 0 0 12px 0; font-family: ${fontFamily}; color: #222222; font-size: 14px; line-height: 1.55;`,
                'li': 'margin-bottom: 6px;'
            };
        }

        // Convert Unicode/ASCII box-drawing tables (e.g. from CLI/terminal output) into standard GFM Markdown tables
        function isTableRuleLine(line) {
            const t = line.trim();
            if (!t) return false;
            if (!/^[\s─━═\-=┌┐└┘├┤┬┴┼╭╮╰╯╔╗╚╝╠╣╦╩╬┏┓┗┛┣┫┳┻╋╞╡╤╧╪╟╢╥╨╫+]+$/.test(t)) {
                return false;
            }
            const hasRules = (t.match(/[─━═\-=]/g) || []).length >= 3;
            const hasJunction = /[┌┐└┘├┤┬┴┼╭╮╰╯╔╗╚╝╠╣╦╩╬┏┓┗┛┣┫┳┻╋╞╡╤╧╪╟╢╥╨╫+]/.test(t);
            return hasRules && hasJunction;
        }

        function isUnicodeTableRow(line) {
            return /[│┃║]/.test(line);
        }

        function isAsciiBoxRow(line) {
            const t = line.trim();
            return t.startsWith('|') && t.endsWith('|') && t.length >= 2;
        }

        function isGfmTableLine(line) {
            const t = line.trim();
            if (!t) return false;
            if (/^\|.*\|$/.test(t)) return true;
            if (/^:?-{3,}:?(\s*\|\s*:?-{3,}:?)+$/.test(t)) return true;
            return false;
        }

        function parseBoxTableBlock(blockLines) {
            const items = blockLines.map(line => ({
                type: isTableRuleLine(line) ? 'rule' : 'row',
                text: line
            }));

            const ruleItems = items.filter(it => it.type === 'rule');
            const rowItems = items.filter(it => it.type === 'row');

            // Require at least one box-drawing rule line and at least 2 content rows
            if (ruleItems.length === 0 || rowItems.length < 2) {
                return blockLines;
            }

            const leftJunctionRe = /^[┌├└╭╰╔╠╚┏┣┗╞╟+]/;
            const rightJunctionRe = /[┐┤┘╮╯╗╣╝┓┫┛╡╢+]$/;
            const hasLeftBorder = rowItems.every(it => /^[│┃║|]/.test(it.text.trim())) &&
                ruleItems.every(it => leftJunctionRe.test(it.text.trim()));
            const hasRightBorder = rowItems.every(it => /[│┃║|]$/.test(it.text.trim())) &&
                ruleItems.every(it => rightJunctionRe.test(it.text.trim()));

            function splitRow(line) {
                let inner = line.trim();
                const useUnicode = /[│┃║]/.test(inner);
                const sepRegex = useUnicode ? /[│┃║]/ : /\|/;
                if (hasLeftBorder) {
                    inner = inner.replace(useUnicode ? /^[│┃║]/ : /^\|/, '');
                }
                if (hasRightBorder) {
                    inner = inner.replace(useUnicode ? /[│┃║]$/ : /\|$/, '');
                }
                return inner.split(sepRegex).map(cell => cell.trim().replace(/\|/g, '\\|'));
            }

            function mergeRowGroup(lines) {
                const parsed = lines.map(splitRow);
                const cols = Math.max(...parsed.map(r => r.length));
                const merged = Array(cols).fill('');
                for (const row of parsed) {
                    for (let c = 0; c < row.length; c++) {
                        if (row[c]) {
                            merged[c] = merged[c] ? `${merged[c]} ${row[c]}` : row[c];
                        }
                    }
                }
                return merged;
            }

            // Trim outer top and bottom border rules
            let start = 0;
            while (start < items.length && items[start].type === 'rule') start++;
            let end = items.length - 1;
            while (end >= start && items[end].type === 'rule') end--;

            const inner = items.slice(start, end + 1);
            if (inner.length === 0) return blockLines;

            const sepIdx = inner.findIndex(it => it.type === 'rule');
            let headerLines;
            let bodyItems;

            if (sepIdx === -1) {
                headerLines = [inner[0].text];
                bodyItems = inner.slice(1);
            } else {
                headerLines = inner.slice(0, sepIdx).filter(it => it.type === 'row').map(it => it.text);
                bodyItems = inner.slice(sepIdx + 1);
            }

            if (headerLines.length === 0) return blockLines;

            const headerRow = mergeRowGroup(headerLines);
            const hasBodyRules = bodyItems.some(it => it.type === 'rule');
            const bodyRows = [];

            if (hasBodyRules) {
                let group = [];
                for (const it of bodyItems) {
                    if (it.type === 'rule') {
                        if (group.length > 0) {
                            bodyRows.push(mergeRowGroup(group));
                            group = [];
                        }
                    } else {
                        group.push(it.text);
                    }
                }
                if (group.length > 0) {
                    bodyRows.push(mergeRowGroup(group));
                }
            } else {
                for (const it of bodyItems) {
                    if (it.type === 'row') {
                        bodyRows.push(splitRow(it.text));
                    }
                }
            }

            if (bodyRows.length === 0) return blockLines;

            const colCount = Math.max(headerRow.length, ...bodyRows.map(r => r.length));
            const padRow = row => {
                const padded = row.slice();
                while (padded.length < colCount) padded.push('');
                return `| ${padded.join(' | ')} |`;
            };

            const gfmLines = [
                padRow(headerRow),
                `| ${Array(colCount).fill('---').join(' | ')} |`,
                ...bodyRows.map(padRow)
            ];

            return gfmLines;
        }

        function convertBoxTablesToMarkdown(text) {
            if (!text) return '';
            const lines = text.split(/\r?\n/);
            const out = [];
            let inFence = false;
            let i = 0;

            while (i < lines.length) {
                const line = lines[i];

                if (/^\s*(```|~~~)/.test(line)) {
                    inFence = !inFence;
                    out.push(line);
                    i++;
                    continue;
                }

                if (inFence) {
                    out.push(line);
                    i++;
                    continue;
                }

                if (isTableRuleLine(line) || isUnicodeTableRow(line)) {
                    const block = [];
                    let j = i;
                    while (j < lines.length && (isTableRuleLine(lines[j]) || isUnicodeTableRow(lines[j]) || isAsciiBoxRow(lines[j]))) {
                        block.push(lines[j]);
                        j++;
                    }
                    const converted = parseBoxTableBlock(block);
                    if (converted !== block) {
                        if (out.length > 0 && out[out.length - 1].trim() !== '') {
                            out.push('');
                        }
                        out.push(...converted);
                        if (j < lines.length && lines[j].trim() !== '') {
                            out.push('');
                        }
                    } else {
                        out.push(...block);
                    }
                    i = j;
                    continue;
                }

                out.push(line);
                i++;
            }

            return out.join('\n');
        }

        function renderEmailHtml(markdown) {
            const font = fontSelect.value;
            const styles = getEmailStyles(font);
            const normalizedMarkdown = convertBoxTablesToMarkdown(markdown || '');
            const rawHtml = marked.parse(normalizedMarkdown);

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = rawHtml;

            // Apply inline styles to each element
            Object.keys(styles).forEach(tag => {
                const elements = tempDiv.getElementsByTagName(tag);
                for (let el of elements) {
                    el.style.cssText += styles[tag];
                }
            });

            // Return container styled for email clients
            return `<div style="font-family: ${font}; font-size: 14px; color: #222222; line-height: 1.55; max-width: 680px;">${tempDiv.innerHTML}</div>`;
        }

        function updatePreview() {
            const val = input.value;
            charCount.innerText = `${val.length} chars`;
            if (!val.trim()) {
                preview.innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 220px; color: #94a3b8; text-align: center; user-select: none;">
                        <div style="font-size: 38px; margin-bottom: 10px;">📋</div>
                        <div style="font-size: 15px; font-weight: 600; color: #475569;">Ready for your text</div>
                        <div style="font-size: 13px; color: #94a3b8; margin-top: 4px; max-width: 340px;">Paste your markdown or raw text on the left to see the instant email-ready preview.</div>
                    </div>
                `;
                return;
            }
            preview.innerHTML = renderEmailHtml(val);
        }

        // Cleaner function: strips │, |, bullets, converts box tables, and repairs terminal hard wraps
        function cleanPastedText(raw) {
            const lines = raw.split(/\r?\n/);
            const strippedLines = [];

            // 1. Strip leading terminal margin characters like "  │ ", "| " (but preserve boxed & GFM tables)
            for (let line of lines) {
                let cleaned = line.trimEnd();
                const trimmed = cleaned.trim();
                const isBoxOrGfmRow = /^[│┃║|].*[│┃║|]$/.test(trimmed);
                if (!isBoxOrGfmRow && !isTableRuleLine(cleaned)) {
                    cleaned = cleaned.replace(/^\s*[│|]\s?/, '');
                }
                strippedLines.push(cleaned);
            }

            // 2. Convert Unicode/ASCII box-drawing tables to clean GFM Markdown tables
            const normalizedLines = convertBoxTablesToMarkdown(strippedLines.join('\n')).split('\n');

            // 3. Re-wrap lines that were cut mid-sentence (while preserving tables and code blocks)
            const resultLines = [];
            let i = 0;
            let inFence = false;

            while (i < normalizedLines.length) {
                let current = normalizedLines[i];

                if (/^\s*(```|~~~)/.test(current)) {
                    inFence = !inFence;
                    resultLines.push(current);
                    i++;
                    continue;
                }

                if (inFence || isGfmTableLine(current)) {
                    resultLines.push(current);
                    i++;
                    continue;
                }

                // If current line is blank, retain blank line
                if (current.trim() === '') {
                    resultLines.push('');
                    i++;
                    continue;
                }

                // Convert bullet character • to standard Markdown "- "
                current = current.replace(/^\s*•\s*/, '- ');

                // Bold numbered prefixes like "1. Name:" -> "1. **Name**:" for high readability
                current = current.replace(/^\s*(\d+\.\s+)([^:\n]+:)/, (match, prefix, title) => {
                    return `${prefix}**${title.replace(/:$/, '')}**:`;
                });

                // Check if following lines are continuations
                while (i + 1 < normalizedLines.length) {
                    const next = normalizedLines[i + 1];
                    const trimmedNext = next.trim();

                    if (!trimmedNext) {
                        break;
                    }

                    if (/^\s*(```|~~~)/.test(next) || isGfmTableLine(next)) {
                        break;
                    }

                    // Conditions where 'next' is a brand new block:
                    // - Starts with a number item (e.g. "2. ")
                    // - Starts with bullet ("- ", "* ", "• ")
                    // - Starts with heading ("#")
                    // - Starts with greeting/sign-off ("Hi ", "Thanks", "Cheers", "Best,")
                    const isNewItem = /^(\d+\.|\-|\*|•|#{1,6}|Hi\s|Thanks\b|Best\b|Regards\b|Sincerely\b)/i.test(trimmedNext);

                    if (isNewItem) {
                        break;
                    }

                    // Otherwise, 'next' is a broken wrapped continuation!
                    // Join with current line
                    current = current + ' ' + trimmedNext;
                    i++;
                }

                resultLines.push(current);
                i++;
            }

            // Clean up multiple consecutive empty lines
            return resultLines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
        }

        // Event listeners
        input.addEventListener('input', updatePreview);
        fontSelect.addEventListener('change', updatePreview);

        cleanTextBtn.addEventListener('click', () => {
            const raw = input.value;
            if (!raw.trim()) {
                showToast("Please paste text first.");
                return;
            }
            const cleaned = cleanPastedText(raw);
            input.value = cleaned;
            updatePreview();
            showToast("✨ Text cleaned and reformatted!");
        });

        clearBtn.addEventListener('click', () => {
            if (!input.value) {
                showToast("Screen is already clear.");
                return;
            }
            input.value = '';
            updatePreview();
            input.focus();
            showToast("Screen cleared!");
        });

        // Copy Rich Text (Clipboard API)
        copyRichBtn.addEventListener('click', async () => {
            if (!input.value.trim()) {
                showToast("Please paste text first.");
                return;
            }
            try {
                const htmlContent = renderEmailHtml(input.value);
                const plainContent = preview.innerText;

                const clipboardItem = new ClipboardItem({
                    'text/plain': new Blob([plainContent], { type: 'text/plain' }),
                    'text/html': new Blob([htmlContent], { type: 'text/html' })
                });

                await navigator.clipboard.write([clipboardItem]);
                showToast("📋 Copied formatted rich text! Ready to paste in email.");
                copyRichBtn.classList.add('btn-success');
                setTimeout(() => copyRichBtn.classList.remove('btn-success'), 1800);
            } catch (err) {
                console.error("Clipboard write error:", err);
                // Fallback: select preview element range
                const range = document.createRange();
                range.selectNodeContents(preview);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                document.execCommand('copy');
                selection.removeAllRanges();
                showToast("Copied via selection fallback!");
            }
        });

        copyHtmlBtn.addEventListener('click', async () => {
            if (!input.value.trim()) {
                showToast("Please paste text first.");
                return;
            }
            const htmlContent = renderEmailHtml(input.value);
            await navigator.clipboard.writeText(htmlContent);
            showToast("Copied raw HTML to clipboard!");
        });

        copyMarkdownBtn.addEventListener('click', async () => {
            if (!input.value.trim()) {
                showToast("Please paste text first.");
                return;
            }
            await navigator.clipboard.writeText(input.value);
            showToast("Copied Markdown to clipboard!");
        });

        // Initialize ready for immediate paste
        input.value = '';
        updatePreview();
        input.focus();
    </script>
</body>

</html>
